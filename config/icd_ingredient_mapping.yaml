# ICD-10 to Drug Ingredient Mapping
# Evidence-based first-line treatments per ICD-10 diagnosis codes
# Source: Indian medical guidelines, WHO Essential Medicines, ICMR protocols

icd_ingredient_mapping:
  # Respiratory (J00-J99)
  J00:  # Acute nasopharyngitis (common cold)
    ingredients: [cetirizine, phenylephrine, paracetamol]
    avoid: []
  
  J06:  # Acute upper respiratory infection
    ingredients: [paracetamol, cetirizine, phenylephrine]
    avoid: []
  
  J20:  # Acute bronchitis
    ingredients: [dextromethorphan, paracetamol, salbutamol]
    avoid: [antihistamine]
  
  J45:  # Asthma
    ingredients: [salbutamol, montelukast, budesonide]
    avoid: [aspirin, ibuprofen, naproxen, diclofenac]
  
  # Symptoms (R00-R99)
  R05:  # Cough
    ingredients: [dextromethorphan, guaifenesin, bromhexine]
    avoid: []
  
  R50:  # Fever
    ingredients: [paracetamol, ibuprofen]
    avoid: []
  
  R51:  # Headache
    ingredients: [paracetamol, ibuprofen]
    avoid: []
  
  R10:  # Abdominal pain
    ingredients: [paracetamol, hyoscine]
    avoid: [nsaid]
  
  # Gastrointestinal (K00-K99)
  K21:  # GERD
    ingredients: [omeprazole, pantoprazole, rabeprazole]
    avoid: []
  
  K30:  # Dyspepsia
    ingredients: [pantoprazole, domperidone]
    avoid: []
  
  K29:  # Gastritis
    ingredients: [pantoprazole, sucralfate]
    avoid: [nsaid, aspirin]
  
  A09:  # Diarrhea
    ingredients: [loperamide, racecadotril, zinc, ors]
    avoid: []
  
  K59:  # Constipation
    ingredients: [ispaghula, lactulose, bisacodyl]
    avoid: []
  
  # Musculoskeletal (M00-M99)
  M79:  # Soft tissue pain
    ingredients: [ibuprofen, diclofenac, paracetamol]
    avoid: []
  
  M54:  # Back pain
    ingredients: [diclofenac, paracetamol, methocarbamol]
    avoid: []
  
  # Allergies (L00-L99, J30)
  J30:  # Allergic rhinitis
    ingredients: [cetirizine, levocetirizine, loratadine, fexofenadine]
    avoid: []
  
  L20:  # Atopic dermatitis
    ingredients: [cetirizine, hydroxyzine]
    avoid: []
  
  L50:  # Urticaria
    ingredients: [cetirizine, levocetirizine]
    avoid: []
  
  # Infections (N00-N99, A00-A99)
  N39:  # UTI
    ingredients: [nitrofurantoin, norfloxacin, ciprofloxacin]
    avoid: []
  
  A00:  # Cholera
    ingredients: [ors, zinc, doxycycline]
    avoid: [loperamide]
  
  # Metabolic (E00-E99)
  E11:  # Type 2 Diabetes
    ingredients: [metformin, glimepiride, sitagliptin]
    avoid: []
  
  # Cardiovascular (I00-I99)
  I10:  # Hypertension
    ingredients: [amlodipine, telmisartan, atenolol]
    avoid: []
  
  I25:  # Chronic ischemic heart disease
    ingredients: [aspirin, atorvastatin, metoprolol]
    avoid: []
  
  # Pregnancy-related (O00-O99)
  O24:  # Gestational diabetes
    ingredients: [insulin]
    avoid: [metformin, glimepiride]
  
  O13:  # Gestational hypertension
    ingredients: [methyldopa, labetalol]
    avoid: [ace_inhibitor, arb]
